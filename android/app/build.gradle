apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Ключ релиза: из android/keystore.properties, иначе из переменных окружения
def releaseKey = [:]
def keyProps = rootProject.file('keystore.properties')
if (keyProps.exists()) {
    def p = new Properties()
    keyProps.withInputStream { p.load(it) }
    releaseKey.store = rootProject.file(p.getProperty('storeFile')).absolutePath
    releaseKey.storePassword = p.getProperty('storePassword')
    releaseKey.alias = p.getProperty('keyAlias')
    releaseKey.keyPassword = p.getProperty('keyPassword')
} else if (System.getenv('YANTAR_KEYSTORE') != null) {
    releaseKey.store = System.getenv('YANTAR_KEYSTORE')
    releaseKey.storePassword = System.getenv('YANTAR_KEYSTORE_PASSWORD')
    releaseKey.alias = System.getenv('YANTAR_KEY_ALIAS')
    releaseKey.keyPassword = System.getenv('YANTAR_KEY_PASSWORD')
}

android {
    namespace = "app.yantar.player"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.yantar.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Код версии растёт со временем сборки (до минуты): новые APK ставятся поверх старых без удаления, а Google Play
        // не встречает один код дважды. yyMMddHHmm − 2 000 000 000: 06.11.2026 18:52 → 611061852 — больше прежних
        // кодов вида yyMMddHH (26110618) и влезает в int до 2041 года
        versionCode Long.parseLong(new java.text.SimpleDateFormat('yyMMddHHmm').format(new Date())) - 2_000_000_000L as int
        versionName "0.12.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Постоянный ключ отладки лежит в репозитории: сборки с любого компьютера и из CI
        // подписаны одинаково и обновляют друг друга без удаления приложения (и данных)
        debug {
            storeFile file('yantar-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Ключ загрузки для Google Play: android/keystore.properties (создаёт android/make-upload-key.ps1,
        // в репозиторий не попадает) или переменные окружения YANTAR_KEYSTORE… (для CI)
        release {
            if (releaseKey.store != null && new File(releaseKey.store).exists()) {
                storeFile file(releaseKey.store)
                storePassword releaseKey.storePassword
                keyAlias releaseKey.alias
                keyPassword releaseKey.keyPassword
            }
        }
    }
    /*
     * Два варианта: site — APK для сайта (всё, включая загрузку с YouTube), play — для Google Play: без YouTube
     * (и без библиотеки NewPipe), интерфейс собирается с VITE_STORE=play (без своего сервера и YouTube).
     * Команды: npm run apk (site, отладка) и npm run aab (play, релиз).
     */
    flavorDimensions 'store'
    productFlavors {
        site {
            dimension 'store'
        }
        play {
            dimension 'store'
            // Идентификатор в Google Play. Сайтовый APK остаётся app.yantar.player, чтобы ставиться поверх старых
            // установок. Пакет Kotlin-классов (namespace) общий — app.yantar.player, это ни на что не влияет.
            applicationId "amber.liner"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseKey.store != null) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

android {
    compileOptions {
        // NewPipeExtractor использует java.nio.file, которого нет в Android до API 33
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "androidx.palette:palette:$paletteVersion"
    // Разбор страниц YouTube для загрузки аудио по ссылке (та же библиотека, что у NewPipe)
    siteImplementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
