# docker compose up --build        → собранная версия на http://localhost:8095
# docker compose --profile dev up  → режим разработки с горячей перезагрузкой на http://localhost:5173
services:
  web:
    build: .
    image: amber-web
    ports:
      - "8095:80"
    restart: unless-stopped

  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - dev_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  dev_node_modules:
